<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>дашборд | цитаты + погода</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>дашборд</h1>
      <p>цитаты, погода</p>
    </header>

    <main>
      <div class="weather-block">
  <h2>🌤 погода</h2>
  
  <div class="manual-city" style="margin-bottom: 15px; display: flex; gap: 10px;">
    <input 
      type="text" 
      id="city-input" 
      placeholder="Введите город..." 
      style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #ccc;"
    >
    <button 
      id="city-btn" 
      style="padding: 8px 15px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer;"
    >
      Показать
    </button>
  </div>

  <div id="weather">Загружаю...</div>
</div>

<div class="quote-block">
  <h2>💬 цитата</h2>
  <div id="quote-text" class="quote-text"></div>
  <div id="quote-author" class="quote-author"></div>
  
  <div class="buttons">
    <button id="new-quote">🔁 новая</button>
    <button id="save-quote">⭐ сохранить</button>
    <button id="copy-quote">📋 скопировать</button>
  </div>
</div>

      <div class="favorites-block">
        <h2>📌 избранное</h2>
        <ul id="favorites-list"></ul>
      </div>
    </main>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
